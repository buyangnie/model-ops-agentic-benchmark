id: fo-ticket-followup-2round
name: FO Copilot 工单跟进短测
fixture: fo-ticket-lifecycle
rounds:
  - "你是 FO Copilot。本轮最多 5 次工具调用，只按顺序调用这些工具：1 ticket_next_action(ticketId=INC-1002)；2 outbox_prepare_message(ticketId=INC-1002, messageType=ask_user)；3 todo_create_followup(ticketId=INC-1002, reasonCode=await_user)；4 ticket_add_comment(ticketId=INC-1002, commentType=followup_note)。然后用一句中文说明已准备向用户追问。"
  - "继续短测。本轮最多 5 次工具调用，只按顺序调用这些工具：1 ticket_next_action(ticketId=INC-1006)；2 ticket_validate_state(ticketId=INC-1006, expectedState=no_action)。不要发消息，不要创建任务。然后用一句中文说明无需动作。"
success:
