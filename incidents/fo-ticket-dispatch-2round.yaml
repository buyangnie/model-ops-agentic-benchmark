id: fo-ticket-dispatch-2round
name: FO Copilot 工单派单短测
fixture: fo-ticket-lifecycle
rounds:
  - "你是 FO Copilot。本轮最多 5 次工具调用，只按顺序调用这些工具：1 ticket_get(ticketId=INC-1001)；2 ticket_enrich(ticketId=INC-1001)；3 people_list_candidates(ticketId=INC-1001)。然后用一句中文说明推荐派给 u-network。"
  - "继续处理 INC-1001。本轮最多 5 次工具调用，只按顺序调用这些工具：1 ticket_assign(ticketId=INC-1001, assigneeId=u-network)；2 ticket_add_comment(ticketId=INC-1001, commentType=assignment_note)；3 ticket_validate_state(ticketId=INC-1001, expectedState=queued)。然后用一句中文总结。"
success:
  expectedTickets:
    - ticketId: INC-1001
      status: queued
      assigneeId: u-network
  expectedComments:
    - ticketId: INC-1001
      commentType: assignment_note
